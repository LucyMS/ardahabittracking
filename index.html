<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Habit & Performance Tracker</title>

  <!-- Apple / iOS Web Clip Standartları -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tracker">
  <meta name="theme-color" content="#121316">
  
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2318191d'/><circle cx='50' cy='50' r='30' fill='none' stroke='%2338bdf8' stroke-width='8'/><path d='M40 50 L47 57 L62 42' fill='none' stroke='%2338bdf8' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/></svg>">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    html, body {
      background-color: #121316;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden !important;
      max-width: 100vw;
      touch-action: pan-y;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .custom-scroll::-webkit-scrollbar {
      display: none;
    }
    .custom-scroll {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    input[type="checkbox"] {
      accent-color: #38bdf8;
      cursor: pointer;
    }
    .modal-closed {
      display: none !important;
    }
    .modal-open {
      display: flex !important;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-zinc-800">

  <!-- Üst Bar & Kontroller -->
  <header class="sticky top-0 z-30 bg-[#121316]/95 backdrop-blur-md border-b border-zinc-800/80 px-4 py-3">
    <div class="max-w-xl mx-auto flex flex-col gap-2.5">
      
      <!-- Tarih ve Navigasyon -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-1.5">
          <button id="prevDayBtn" type="button" class="p-2 rounded-lg bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 active:scale-95 text-zinc-300">
            <i class="fa-solid fa-chevron-left text-xs"></i>
          </button>
          <div class="text-left">
            <div id="currentDateTitle" class="text-sm font-semibold text-zinc-100 flex items-center gap-1.5 cursor-pointer">
              <span>Seçili Tarih</span>
              <i class="fa-solid fa-calendar-day text-[11px] text-zinc-400"></i>
            </div>
            <div id="currentDaySub" class="text-[11px] text-zinc-400">Pazartesi • PULL 1</div>
          </div>
          <button id="nextDayBtn" type="button" class="p-2 rounded-lg bg-zinc-900 border border-zinc-800 hover:bg-zinc-800 active:scale-95 text-zinc-300">
            <i class="fa-solid fa-chevron-right text-xs"></i>
          </button>
        </div>

        <button id="todayBtn" type="button" class="px-2.5 py-1 text-xs rounded-md bg-zinc-800 text-zinc-300 border border-zinc-700/60 active:scale-95">
          Bugün
        </button>
      </div>

      <!-- Fonksiyonel Butonlar (4'lü Sade Menü) -->
      <div class="grid grid-cols-4 gap-1.5 text-[11px] font-medium">
        <button id="openFastMacroBtn" type="button" class="flex items-center justify-center gap-1 py-2 px-2 rounded-xl bg-sky-500/10 text-sky-400 border border-sky-500/20 active:scale-95">
          <i class="fa-solid fa-camera text-xs"></i>
          <span>Makro</span>
        </button>
        <button id="summaryExportBtn" type="button" class="flex items-center justify-center gap-1 py-2 px-2 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 active:scale-95">
          <i class="fa-solid fa-clipboard-list text-xs"></i>
          <span>Özet</span>
        </button>
        <button id="historyBtn" type="button" class="flex items-center justify-center gap-1 py-2 px-2 rounded-xl bg-zinc-800/80 text-zinc-300 border border-zinc-700/50 active:scale-95">
          <i class="fa-solid fa-chart-simple text-xs"></i>
          <span>Geçmiş</span>
        </button>
        <button id="cloudBtn" type="button" class="flex items-center justify-center gap-1 py-2 px-2 rounded-xl bg-zinc-800/80 text-zinc-300 border border-zinc-700/50 active:scale-95">
          <i class="fa-solid fa-cloud text-xs text-sky-400"></i>
          <span id="cloudStatusText">Bulut</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Ana İçerik Alanı -->
  <main class="max-w-xl w-full mx-auto p-4 space-y-4">

    <!-- Lean Bulk Makro Kartı -->
    <section class="bg-[#18191d] rounded-2xl p-4 border border-zinc-800/80 shadow-sm space-y-3">
      <div class="flex items-center justify-between border-b border-zinc-800/60 pb-2.5">
        <div class="flex items-center gap-2">
          <div class="w-2.5 h-2.5 rounded-full bg-sky-400"></div>
          <h2 class="text-xs font-semibold uppercase tracking-wider text-zinc-300">Lean Bulk (2.400 kcal)</h2>
        </div>
        <label class="flex items-center gap-1.5 cursor-pointer select-none">
          <span class="text-[11px] text-zinc-400">Diyete Uydum</span>
          <input type="checkbox" id="dietCompliantToggle" class="w-4 h-4 rounded bg-zinc-900 border-zinc-700">
        </label>
      </div>

      <!-- Makro Barları Grid -->
      <div class="grid grid-cols-4 gap-2 text-center">
        <div class="p-2.5 rounded-xl bg-zinc-900/80 border border-zinc-800">
          <div class="text-[10px] text-zinc-400">Kalori</div>
          <div id="calVal" class="text-base font-bold text-zinc-100">0</div>
          <div class="text-[9px] text-zinc-500">/ 2400</div>
        </div>
        <div class="p-2.5 rounded-xl bg-zinc-900/80 border border-zinc-800">
          <div class="text-[10px] text-zinc-400">Protein</div>
          <div id="proteinVal" class="text-base font-bold text-sky-400">0g</div>
          <div class="text-[9px] text-zinc-500">/ 145g</div>
        </div>
        <div class="p-2.5 rounded-xl bg-zinc-900/80 border border-zinc-800">
          <div class="text-[10px] text-zinc-400">Karb</div>
          <div id="carbVal" class="text-base font-bold text-amber-400">0g</div>
          <div class="text-[9px] text-zinc-500">/ 345g</div>
        </div>
        <div class="p-2.5 rounded-xl bg-zinc-900/80 border border-zinc-800">
          <div class="text-[10px] text-zinc-400">Yağ</div>
          <div id="fatVal" class="text-base font-bold text-rose-400">0g</div>
          <div class="text-[9px] text-zinc-500">/ 55g</div>
        </div>
      </div>

      <!-- Adım & Alışkanlıklar -->
      <div class="flex items-center justify-between pt-1 text-xs text-zinc-400">
        <div class="flex items-center gap-1.5">
          <i class="fa-solid fa-person-walking text-zinc-300"></i>
          <span id="stepCountDisplay" class="font-semibold text-zinc-200">0</span>
          <span>/ 10.000 Adım</span>
        </div>
        <div class="flex items-center gap-3">
          <label class="flex items-center gap-1 cursor-pointer select-none">
            <input type="checkbox" id="waterHabitToggle" class="w-3.5 h-3.5 rounded">
            <span class="text-[11px]">3.5L Su</span>
          </label>
          <label class="flex items-center gap-1 cursor-pointer select-none">
            <input type="checkbox" id="magnesiumHabitToggle" class="w-3.5 h-3.5 rounded">
            <span class="text-[11px]">Magnezyum</span>
          </label>
        </div>
      </div>
    </section>

    <!-- Günün Ağır PPL Antrenmanı -->
    <section class="bg-[#18191d] rounded-2xl p-4 border border-zinc-800/80 shadow-sm space-y-3">
      <div class="flex items-center justify-between border-b border-zinc-800/60 pb-2">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-dumbbell text-sky-400 text-xs"></i>
          <h2 id="workoutSectionTitle" class="text-xs font-semibold uppercase tracking-wider text-zinc-300">Günün Antrenmanı</h2>
        </div>
        <span id="workoutStatusBadge" class="text-[10px] px-2 py-0.5 rounded-full bg-zinc-800 text-zinc-300">0/0</span>
      </div>

      <div id="workoutList" class="space-y-2"></div>
    </section>

    <!-- ESTÜ Ders Programı -->
    <section class="bg-[#18191d] rounded-2xl p-4 border border-zinc-800/80 shadow-sm space-y-3">
      <div class="flex items-center
